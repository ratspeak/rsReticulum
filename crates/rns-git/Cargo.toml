[package]
name = "rns-git"
description = "Git over Reticulum: rngit-rs and the rngcs-rs commit signer"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
autobins = false

[dependencies]
rns-tools = { path = "../rns-tools", default-features = false }
rns-identity = { workspace = true }
rns-runtime = { workspace = true }
rns-transport = { workspace = true }
tracing = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
nix = { workspace = true }
rmpv = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rns-wire = { workspace = true, features = ["std"] }
tempfile = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "rngcs-rs"
path = "src/bin/rngcs-rs.rs"

[[bin]]
name = "rngit-rs"
path = "src/bin/rngit-rs.rs"

[[bin]]
name = "git-remote-rns"
path = "src/bin/git-remote-rns.rs"
