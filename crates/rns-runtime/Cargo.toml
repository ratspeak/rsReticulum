[package]
name = "rns-runtime"
description = "Core runtime, config parsing, and lifecycle for Reticulum"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
serial = ["rns-interface/serial"]
rnode-tcp = ["rns-interface/rnode-tcp"]
ble = ["rns-interface/ble"]
api = ["dep:axum", "dep:tower-http", "dep:serde_json"]

[dependencies]
rns-crypto = { workspace = true, features = ["std"] }
rns-wire = { workspace = true, features = ["std"] }
rns-identity = { workspace = true }
rns-transport = { workspace = true }
rns-link = { workspace = true }
rns-protocol = { workspace = true }
rns-interface = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
tracing = { workspace = true }
hmac = { workspace = true }
md-5 = { workspace = true }
sha2 = { workspace = true }
rmp-serde = { workspace = true }
rmpv = { workspace = true, features = ["with-serde"] }
serde = { workspace = true }
subtle = { workspace = true }
hex = { workspace = true }
nix = { workspace = true }

# Optional REST API (feature = "api")
axum = { version = "0.8", features = ["json"], optional = true }
tower-http = { version = "0.6", features = ["cors", "trace"], optional = true }
serde_json = { version = "1.0", optional = true }
