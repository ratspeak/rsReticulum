[package]
name = "rns-link"
description = "Link layer and encrypted channel for Reticulum"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["rns-crypto/std", "rns-wire/std"]

[dependencies]
rns-crypto = { workspace = true }
rns-wire = { workspace = true }
rns-identity = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
rmpv = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
hex = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance"] }

[dev-dependencies]
proptest = { workspace = true }
